<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Larysa Semykova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root { --paper:#ECEFF3; --ink:#1B2033; --ink-2:#3A4157; --slate:#5F6779; --rule:#C7CDD8; --amber:#B5812A; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --paper:#13182A; --ink:#ECEDF1; --ink-2:#C2C6D3; --slate:#8F97AB; --rule:#2F3750; --amber:#E2AA4C; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Literata","Georgia",serif; font-size:18px; line-height:1.65; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:40em; margin:0 auto; padding:0 24px 96px; }
  header { border-bottom:1px solid var(--rule); margin-bottom:56px; }
  header .inner { max-width:40em; margin:0 auto; padding:20px 24px; display:flex; align-items:baseline; gap:18px; }
  header a { text-decoration:none; color:var(--ink); font-family:"Oranienbaum",serif; font-size:22px; }
  header span { font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--slate); margin-left:auto; }
  h1 { font-family:"Oranienbaum","Georgia",serif; font-weight:400; font-size:clamp(32px,5vw,48px); line-height:1.08; margin:0 0 10px; text-wrap:balance; }
  time { display:block; font-family:"IBM Plex Sans",sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); margin-bottom:40px; }
  article p { margin:0 0 1.2em; }
  article h2 { font-family:"Oranienbaum",serif; font-weight:400; font-size:28px; margin:1.8em 0 .5em; }
  article a { color:var(--ink); text-decoration-color:var(--amber); text-underline-offset:3px; }
  article img { max-width:100%; height:auto; border:1px solid var(--rule); }
  article blockquote { margin:1.4em 0; padding-left:20px; border-left:2px solid var(--amber); color:var(--ink-2); font-style:italic; }
  .back { display:inline-block; margin-top:64px; padding-top:20px; border-top:1px solid var(--rule); width:100%; font-family:"IBM Plex Sans",sans-serif; font-size:13px; color:var(--slate); text-decoration:none; }
  .back:hover { color:var(--ink); }
  a:focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
</style>
</head>
<body>
<header><div class="inner"><a href="/">Larysa Semykova</a><span>Notes</span></div></header>
<div class="wrap">
  <h1>{{ page.title }}</h1>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  <article>
    {{ content }}
  </article>
  <a class="back" href="/#notes">← All notes</a>
</div>
</body>
</html>
